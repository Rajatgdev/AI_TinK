services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: remember_me
      POSTGRES_PASSWORD: remember_me
      POSTGRES_DB: remember_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remember_me -d remember_me"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
